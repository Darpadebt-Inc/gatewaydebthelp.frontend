name: D4 footprint live probe (temporary)

# TEMPORARY, read-only. Curls deployed blog pages on all three owned sites and asserts
# (a) HTTP 200, (b) no brand-trust-links footprint class, (c) no "Trusted partners" footprint
# header, (d) zero cross-site <a> to the OTHER two owned domains in the served HTML.
# Remove this workflow once D4 is verified.
on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency: d4-footprint-probe

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe deployed blog pages for cross-site footprint + 200
        run: |
          set -u
          fail=0
          probe() { # $1=url  $2=sibling1  $3=sibling2
            local url="$1" s1="$2" s2="$3" code bt tp xa
            code=$(curl -sL -o /tmp/p.html -w '%{http_code}' -m 25 "$url" || echo 000)
            bt=$(grep -c 'class="brand-trust-links"' /tmp/p.html 2>/dev/null || true); bt=${bt:-0}
            tp=$(grep -c 'Trusted partners you can click' /tmp/p.html 2>/dev/null || true); tp=${tp:-0}
            xa=$(grep -oE "<a[^>]*href=\"https://(www\.)?(${s1}|${s2})[^\"]*\"" /tmp/p.html 2>/dev/null | wc -l | tr -d ' ')
            printf '  [%s] brand-trust=%s trusted-partners=%s cross-site-a=%s  %s\n' "$code" "$bt" "$tp" "$xa" "$url"
            [ "$code" = "200" ] || { echo "::error::non-200 ($code): $url"; fail=1; }
            [ "$bt" = "0" ] && [ "$tp" = "0" ] || { echo "::error::brand-trust footprint present: $url"; fail=1; }
            [ "$xa" = "0" ] || { echo "::error::cross-site <a> present: $url"; fail=1; }
          }
          echo "== gatewaydebthelp.com (siblings: debthelpform, debtreliefguard) =="
          probe "https://gatewaydebthelp.com/" debthelpform.com debtreliefguard.com
          probe "https://gatewaydebthelp.com/blog/rebuilding-credit-after-debt-relief-key-steps-and-strategies-for-success" debthelpform.com debtreliefguard.com
          probe "https://gatewaydebthelp.com/blog/how-to-set-up-a-hardship-payment-plan" debthelpform.com debtreliefguard.com
          echo "== debthelpform.com (siblings: gatewaydebthelp, debtreliefguard) =="
          probe "https://debthelpform.com/" gatewaydebthelp.com debtreliefguard.com
          probe "https://debthelpform.com/blog/understanding-debt-relief-options-a-comprehensive-guide-for-consumers" gatewaydebthelp.com debtreliefguard.com
          echo "== debtreliefguard.com (siblings: debthelpform, gatewaydebthelp) =="
          probe "https://debtreliefguard.com/" debthelpform.com gatewaydebthelp.com
          probe "https://debtreliefguard.com/blog/how-to-handle-a-debt-collection-lawsuit-summons" debthelpform.com gatewaydebthelp.com
          probe "https://debtreliefguard.com/blog/how-to-request-debt-validation-in-writing" debthelpform.com gatewaydebthelp.com
          echo "---"
          if [ "$fail" = "0" ]; then echo "D4 LIVE PROBE: PASS (all 200, zero footprint)"; else echo "D4 LIVE PROBE: FAIL"; exit 1; fi
